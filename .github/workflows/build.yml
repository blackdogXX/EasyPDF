name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk EasyPDF.apk
          ls -l EasyPDF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPDF
          path: EasyPDF.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest EasyPDF.apk \
            --target "$GITHUB_SHA" \
            --title "EasyPDF 1.0.$GITHUB_RUN_NUMBER" \
            --notes "Автоматическая сборка №$GITHUB_RUN_NUMBER. Скачайте EasyPDF.apk и установите на телефон."
